apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: timoni-plugin
spec:
  init:
    command: ["/bin/sh", "-c"]
    args: ["true"]
  generate:
    command: ["/bin/bash", "-c"]
    args: ["/home/argocd/cmp-server/config/generate.sh"]
  discover:
    # find.command's MATCH signal is non-empty stdout, not exit code — `test`
    # is silent even on success, so it never matches. Use `find` so it prints
    # the matched filename.
    find:
      command: ["sh", "-c"]
      args: ["find . -maxdepth 1 \\( -name timoni.cue -o -name values.yaml \\) -print -quit"]
