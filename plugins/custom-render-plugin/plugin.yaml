apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: custom-render-plugin
spec:
  init:
    command: ["/bin/sh", "-c"]
    args: ["true"]
  generate:
    command: ["/bin/bash", "-c"]
    args: ["/home/argocd/cmp-server/config/generate.sh"]
  discover:
    fileName: "config.env"
