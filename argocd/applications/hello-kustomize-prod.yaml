apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-kustomize-prod
  namespace: argocd
spec:
  project: hello-world-plugins-lab
  source:
    repoURL: "https://github.com/<your-org>/hello-world-plugins-lab.git"
    targetRevision: main
    path: apps/hello-kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-plugins-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
