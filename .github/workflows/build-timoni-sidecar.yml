name: Build timoni-plugin sidecar image

on:
  push:
    branches: [main]
    paths:
      - plugins/timoni-plugin/Dockerfile
      - apps/hello-timoni/cue.mod/**
      - apps/hello-timoni/templates/**
      - apps/hello-timoni/timoni.cue
      - .github/workflows/build-timoni-sidecar.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/timoni-cmp-sidecar
  TIMONI_VERSION: "0.26.0"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Repo root, not plugins/timoni-plugin — the Dockerfile COPYs the
          # module in from apps/hello-timoni, outside its own directory.
          context: .
          file: plugins/timoni-plugin/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            TIMONI_VERSION=${{ env.TIMONI_VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TIMONI_VERSION }}
            ${{ env.IMAGE }}:latest
