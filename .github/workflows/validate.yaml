# GitHub Actions only discovers workflows under .github/workflows/, so this
# file is mirrored there as .github/workflows/validate.yaml (kept identical).
# Edit this copy and keep the other in sync, or symlink them.
name: Validate manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint hello-helm chart
        run: helm lint apps/hello-helm

  helm-template-validate:
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: helm template
        run: helm template hello-helm apps/hello-helm > /tmp/hello-helm.yaml
      - name: Validate rendered chart
        run: kubeconform -strict -summary /tmp/hello-helm.yaml

  kustomize-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Build dev overlay
        run: kubectl kustomize apps/hello-kustomize/overlays/dev > /tmp/dev.yaml
      - name: Build prod overlay
        run: kubectl kustomize apps/hello-kustomize/overlays/prod > /tmp/prod.yaml
      - name: Validate dev overlay
        run: kubeconform -strict -summary /tmp/dev.yaml
      - name: Validate prod overlay
        run: kubeconform -strict -summary /tmp/prod.yaml

  timoni-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install timoni
        run: curl -sSL https://get.timoni.sh | bash
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: timoni mod vet
        run: timoni mod vet apps/hello-timoni
      - name: timoni build (defaults only)
        run: timoni build hello-timoni apps/hello-timoni -n hello-world-plugins-lab > /tmp/hello-timoni.yaml
      - name: Validate rendered module (defaults only)
        run: kubeconform -strict -summary /tmp/hello-timoni.yaml
      - name: timoni build (values.yaml override)
        run: |
          timoni build hello-timoni apps/hello-timoni -n hello-world-plugins-lab \
            --values apps/hello-timoni/values.yaml > /tmp/hello-timoni-overridden.yaml
      - name: Validate rendered module (values.yaml override)
        run: kubeconform -strict -summary /tmp/hello-timoni-overridden.yaml
      - name: timoni mod vet (every field set — values-full-example.yaml)
        run: |
          timoni mod vet apps/hello-timoni --name hello-timoni \
            --values apps/hello-timoni/values-full-example.yaml
      - name: timoni build (every field set — values-full-example.yaml)
        run: |
          timoni build hello-timoni apps/hello-timoni -n hello-world-plugins-lab \
            --values apps/hello-timoni/values-full-example.yaml > /tmp/hello-timoni-full.yaml
      - name: Validate rendered module (values-full-example.yaml)
        run: kubeconform -strict -summary /tmp/hello-timoni-full.yaml
      - name: timoni build (hello-timoni-values against the same module)
        run: |
          # Simulates what plugins/timoni-plugin/generate.sh does against the
          # sidecar's baked-in module copy, using the local module path
          # instead — proves apps/hello-timoni-values/values.yaml stays valid
          # without needing the built sidecar image in CI.
          timoni build hello-timoni-values apps/hello-timoni -n hello-world-plugins-lab \
            --values apps/hello-timoni-values/values.yaml > /tmp/hello-timoni-values.yaml
      - name: Validate rendered module (hello-timoni-values)
        run: kubeconform -strict -summary /tmp/hello-timoni-values.yaml

  shellcheck-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck CMP generate script
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./plugins"
      - name: Shellcheck helper scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
