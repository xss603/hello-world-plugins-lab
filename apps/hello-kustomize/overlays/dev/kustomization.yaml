apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: dev-
resources:
  - ../../base
# includeSelectors: true is load-bearing, not cosmetic: namePrefix alone only
# renames resources, it doesn't touch matchLabels/selectors. Without this,
# dev's and prod's Services both select on the base's bare
# app.kubernetes.io/name label and silently load-balance across each other's
# pods when deployed to the same namespace. This adds app.kubernetes.io/
# instance: dev to metadata.labels, matchLabels, and the Service selector
# together, scoping dev to only its own pods.
labels:
  - pairs:
      app.kubernetes.io/instance: dev
    includeSelectors: true
patches:
  - target:
      kind: Deployment
      name: hello-kustomize
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: |
          echo 'Hello World from hello-kustomize (dev)' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
