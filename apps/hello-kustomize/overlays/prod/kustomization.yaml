apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: prod-
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: hello-kustomize
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: |
          echo 'Hello World from hello-kustomize (prod)' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
