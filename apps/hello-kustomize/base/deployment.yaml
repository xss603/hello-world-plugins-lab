apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-kustomize
  labels:
    app.kubernetes.io/name: hello-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-kustomize
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-kustomize
          image: nginxinc/nginx-unprivileged:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo 'Hello World from hello-kustomize' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          emptyDir: {}
