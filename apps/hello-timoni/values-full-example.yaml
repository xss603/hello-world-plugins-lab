# A comprehensive reference showing every field in templates/config.cue's
# #Config explicitly set — not the module's recommended configuration (see
# values.yaml for that; this module needs no values file at all by default).
# Use this as a lookup for "what does field X actually look like", not as
# something to apply verbatim: imagePullSecrets/tolerations/affinity/
# topologySpreadConstraints are illustrative placeholders, and
# ingress/secret/persistence/imagePullSecret are enabled here purely to
# exercise them — ingress needs a real controller, and its host/
# tls.secretName, along with imagePullSecret's registry/username/password,
# are examples, not real credentials.
#
# kubeVersion, moduleVersion, and metadata.name/namespace are deliberately
# absent: timoni.cue injects those from the CLI/cluster via @tag(...), not
# from values, so setting them here would be ignored (or conflict).
#
# Verified: `timoni mod vet` and `timoni build` both succeed against this
# file, exercising every optional resource (Ingress+TLS, the generic Secret,
# PVC, the imagePullSecret dockerconfigjson Secret — two distinct Secret
# objects, "hello-timoni" and "hello-timoni-pull", no name collision —
# extraObjects, and vault) together — see ci/validate.yaml. Also verified
# with a live `timoni apply`/`delete` round trip: extraObjects' NetworkPolicy
# and ConfigMap were both created and, on delete, both pruned along with
# everything else; the vault.hashicorp.com/* annotations landed correctly on
# a Running/Ready pod (no injector installed in this lab cluster, so no
# sidecar was actually mutated in — that part is unverified here).
values:
  message: "Hello World"

  image:
    repository: cgr.dev/chainguard/nginx
    tag: "1.25.3"
    digest: "sha256:3dd8fa303f77d7eb6ce541cb05009a5e8723bd7e3778b95131ab4a2d12fadb8f"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"
    requests:
      cpu: "50m"
      memory: "32Mi"

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    privileged: false
    capabilities:
      drop: ["ALL"]
      add: []
    seccompProfile:
      type: RuntimeDefault

  service:
    port: 8080
    annotations:
      example.com/service-annotation: "true"

  podAnnotations:
    example.com/pod-annotation: "true"

  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  metadata:
    labels:
      team: platform
    annotations:
      example.com/owner: platform-team

  imagePullSecrets:
    - name: regcred

  imagePullSecret:
    enabled: true
    registry: registry.example.com
    username: myuser
    password: mypassword
    email: ops@example.com

  tolerations:
    - key: "example.com/dedicated"
      operator: "Equal"
      value: "hello-timoni"
      effect: "NoSchedule"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values: ["linux"]

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: hello-timoni

  test:
    enabled: false
    image:
      repository: cgr.dev/chainguard/curl
      tag: "latest"
      digest: ""

  ingress:
    enabled: true
    className: nginx
    host: hello-timoni.example.com
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      enabled: true
      secretName: hello-timoni-tls

  secret:
    enabled: true
    stringData:
      API_KEY: "super-secret-value"

  persistence:
    enabled: true
    size: "5Gi"
    storageClassName: standard
    accessModes: ["ReadWriteOnce"]
    mountPath: "/data"

  # Passed straight through — not modeled by the schema at all, so unlike
  # every field above, these get no injected labels and no default
  # namespace. Namespaced kinds need their own metadata.namespace or `timoni
  # apply` fails at apply time (not at build/vet time) with e.g. "namespace
  # not specified: the server could not find the requested resource".
  extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: hello-timoni-allow-same-namespace
        namespace: hello-world-plugins-lab
      spec:
        podSelector: {}
        policyTypes: ["Ingress"]
        ingress:
          - from:
              - namespaceSelector: {}
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: hello-timoni-extra-config
        namespace: hello-world-plugins-lab
      data:
        foo: bar

  # Requires the Vault Agent Injector webhook installed in-cluster, and Vault
  # reachable from it to validate this ServiceAccount's token — the
  # annotations below render and apply fine either way (harmless no-ops
  # without the injector), but actual secret injection needs both. The role
  # and paths here match what's configured on https://vault.nifiops.app/ for
  # this lab: a "hello-timoni" Kubernetes auth role bound to
  # ServiceAccount hello-timoni in namespace hello-world-plugins-lab, and
  # two example secrets written to the KV v2 engine at secret/.
  vault:
    enabled: true
    role: hello-timoni
    secrets:
      - name: config
        path: secret/data/hello-timoni/config
      - name: db
        path: secret/data/hello-timoni/db
