apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-helm.fullname" . }}
  labels:
    {{- include "hello-helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello-helm.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-helm.labels" . | nindent 8 }}
    spec:
      # uid/gid 101 is nginxinc/nginx-unprivileged's built-in "nginx" user —
      # matching it here (rather than an arbitrary non-root uid) is what
      # lets the container actually start without a permission error.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          # /usr/share/nginx/html ships root:root 0755 in this image, so uid
          # 101 can't write index.html directly into it — the "html" emptyDir
          # volume below replaces that directory with something the fsGroup
          # can actually write to. Skipping the volume reproduces the
          # CrashLoopBackOff this chart originally shipped with.
          args:
            - |
              echo '{{ .Values.message }}' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          emptyDir: {}
