replicaCount: 1

# nginx-unprivileged (not plain nginx) is what lets the pod run as a non-root
# uid — see templates/deployment.yaml for why uid 101 specifically.
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

message: "Hello World from hello-helm"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
